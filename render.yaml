services:
  - type: web
    name: alphapulse-stock-predictor
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: CACHE_EXPIRY_HOURS
        value: "12"
      - key: LIVE_CACHE_MINUTES
        value: "15"
      - key: SECRET_KEY
        generateValue: true
