<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Stock Prediction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            width: 350px;
            text-align: center;
        }
        .btn-custom {
            background: #d32f2f;
            color: white;
            width: 100%;
        }
        .btn-custom:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🇺🇸 US Stock Predictor</h2>
        <form action="/predict_us" method="POST">
            <div class="mb-3">
                <label class="form-label">📌 Stock Symbol:</label>
                <input type="text" name="ticker" class="form-control" placeholder="e.g. AAPL, TSLA" required>
            </div>
            <div class="mb-3">
                <label class="form-label">📅 Days in Future:</label>
                <input type="number" name="days" class="form-control" placeholder="Enter number of days" required>
            </div>
            <button type="submit" class="btn btn-custom">🔮 Predict</button>
        </form>
        <br>
        <a href="/" class="btn btn-secondary">⬅ Back</a>
    </div>
</body>
</html>
