<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            width: 450px;
            text-align: center;
        }
        h2, h3 { 
            color: white; /* 🔹 Change Headings to White */
        }
        .btn-custom {
            background: #d32f2f;
            color: white;
            width: 100%;
        }
        .btn-custom:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📊 Prediction for {{ ticker }}</h2>
        <h3>🔮 Predicted Price: <span style="color: white;">${{ predicted_price }}</span></h3>
        <img src="data:image/png;base64,{{ plot_url }}" class="img-fluid">
        <br>
        <a href="/" class="btn btn-custom">🔄 Try Another Prediction</a>
    </div>
</body>
</html>
